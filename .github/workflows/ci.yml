name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node test.mjs
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Runner compiler is accepted
        shell: cmd
        run: call cargo-msvc.bat --version
